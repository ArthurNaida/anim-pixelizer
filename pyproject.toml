[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anim-pixelizer"
version = "0.1.0"
description = "Deterministic pipeline for pixel-art sprite animation cleanup and review"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "google-genai>=1.0.0",
]

[project.scripts]
anim-pixelizer = "cli:main"

[tool.setuptools]
py-modules = ["cli", "fixer", "llm", "postprocess", "review", "preprocess"]